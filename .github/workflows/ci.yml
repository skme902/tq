name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            parity/go.sum
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
      - name: Lint
        run: scripts/ci/lint.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tqtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TQ_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/tqtest?sslmode=disable
      CI_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            parity/go.sum
      - name: Test
        run: scripts/ci/test.sh
        env:
          TEST_JSON: ${{ runner.temp }}/test.json
      - name: Upload test JSON
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-json
          path: ${{ runner.temp }}/test.json
          if-no-files-found: ignore
